</style></head><body><main class="wrap"><header><h1>ÔN THI VĂN HÓA SUN GROUP 2026</h1><p>Bộ câu hỏi trắc nghiệm · Chọn đáp án để xem kết quả ngay</p></header><section class="toolbar"><div class="controls"><div class="field"><label for="group">Chủ đề</label><select id="group"></select></div><div class="field"><label for="search">Tìm câu hỏi</label><input id="search" placeholder="Nhập từ khóa..."></div><div class="field"><label for="filter">Hiển thị</label><select id="filter"><option value="all">Tất cả câu hỏi</option><option value="todo">Chưa trả lời</option><option value="wrong">Trả lời sai</option><option value="right">Trả lời đúng</option></select></div><button id="reset" class="secondary">Làm lại / Đảo đề</button></div></section><section class="stats"><div><div class="num" id="total">0</div><div class="muted">Tổng câu trong chủ đề</div></div><div><div class="num" id="done">0</div><div class="muted">Đã làm</div></div><div><div class="num" id="right">0</div><div class="muted">Đúng</div></div><div><div class="num" id="wrong">0</div><div class="muted">Sai</div></div></section><div id="questions"></div><p class="foot">Đáp án được lấy từ file Excel nguồn. Thứ tự câu hỏi và phương án được xáo trộn mỗi lần tải lại trang.</p></main><script>
const SOURCE=[{"q": "Theo GTCL “Trung thành và trung thực”, Người Sun Group cần hoàn thành mọi nhiệm vụ được giao như thế nào?", "a": 2, "opts": ["Sáng tạo, đổi mới để kết quả công việc đạt hiệu quả cao hơn", "Chủ động học hỏi, nỗ lực hoàn thiện bản thân", "Hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết", "Dám nhận và chịu trách nhiệm đến cùng nhiệm vụ được giao"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện một trong các yêu cầu về Năng lực cạnh tranh của Người Sun Group trong thời kì mới?", "a": 2, "opts": ["Sống văn minh, cởi mở học hỏi, hoàn thiện bản thân để theo kịp với thời cuộc và sự phát triển của tổ chức, của xã hội.", "Tìm hiểu, lựa chọn thưởng thức nhằm nâng cao khả năng cảm thụ về các loại hình nghệ thuật.", "Tiên phong sáng tạo, đổi mới, tạo ra những lợi thế cạnh tranh độc đáo, khác biệt cho Việt Nam trên cộng đồng quốc tế.", "Thông hiểu và thuần thục ít nhất một ngoại ngữ thông dụng để nâng cao khả năng hội nhập."], "group": "NQ126 – Chương 3"}, {"q": "Trong Môi trường phát triển Người Sun Group, môi trường làm việc Sun Group xác định yếu tố nào là thước đo sự đóng góp của mỗi người?", "a": 3, "opts": ["Năng lực, kinh nghiệm và thành tích", "Văn hóa, nhân văn và tinh thần học hỏi", "Mức độ gắn kết và sự hài lòng", "Tính kỷ luật, ý thức trách nhiệm, kết quả cuối cùng"], "group": "NQ126 – Chương 3"}, {"q": "Triết lý về Người Sun Group đã định nghĩa rõ về tiêu chí HIỀN và TÀI; theo đó tiêu chí TÀI được mô tả như thế nào?", "a": 3, "opts": ["Luôn hành động theo những GTCL của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp và là nguồn cảm hứng cho đồng nghiệp", "Sống khiêm nhường, trung thực, tự trọng vừa hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng", "Luôn là tấm gương với đồng nghiệp và cấp dưới về năng lực, tinh thần nhiệt huyết, tiên phong, dám dấn thân, dám nghĩ, dám làm, biết làm và dám chịu trách nhiệm", "Chủ động học hỏi, nỗ lực hoàn thiện bản thân và luôn xem sự trưởng thành liên tục của bản thân là yếu tố nền tảng và thước đo cho sự bền vững của tập thể, của Sun Group, của cộng đồng và của đất nước Việt Nam"], "group": "NQ126 – Chương 3"}, {"q": "Yêu cầu về Sức khỏe của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?", "a": 3, "opts": ["Ý thức tốt - Nhân cách tốt - Tinh thần tốt.", "Sức khỏe tốt - Tinh thần tốt - Lối sống tốt.", "Thể chất khỏe mạnh - Tinh thần khỏe mạnh - Năng suất lao động cao.", "Thể chất khỏe mạnh - Tinh thần khỏe mạnh - Lối sống lành mạnh."], "group": "NQ126 – Chương 3"}, {"q": "Yêu cầu về Phẩm chất của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?", "a": 3, "opts": ["Sức khỏe tốt - Tinh thần tốt - Lối sống tốt.", "Thể chất khỏe mạnh - Tinh thần khỏe mạnh - Lối sống lành mạnh.", "Ý thức tốt - Nhân cách tốt - Tinh thần tốt.", "Yêu nước - Lý tưởng - Khiêm nhường - Nhân cách tốt"], "group": "NQ126 – Chương 3"}, {"q": "Trong các yêu cầu về Sức khỏe của Người Sun Group thời kỳ mới, không hút thuốc, hạn chế bia rượu và cân bằng công việc và cuộc sống thuộc yếu tố nào?", "a": 0, "opts": ["Lối sống lành mạnh", "Tinh thần khỏe mạnh", "Ý thức vì cộng đồng", "Thể chất khỏe mạnh"], "group": "NQ126 – Chương 3"}, {"q": "Theo yêu cầu đối với CBLĐ/CBQL Sun Group, Người đứng đầu không chỉ là chỗ dựa cho nhân viên mà còn giữ vai trò gì đối với tổ chức?", "a": 1, "opts": ["Nền tảng văn hóa", "Lực đẩy cho sự phát triển", "Sợi dây kết nối", "Thước đo thành công"], "group": "NQ126 – Chương 3"}, {"q": "Các công trình sản phẩm của Phú Quốc liên tục nhận được các giải thưởng uy tín của thế giới thể hiện GTCL nào của Tập đoàn", "a": 0, "opts": ["Đẳng cấp", "Chất lượng", "Trình độ chuyên môn cao", "Bản sắc"], "group": "NQ126 – Chương 3"}, {"q": "Sun PhuQuoc Airways tập trung phát triển các đường bay quốc tế đưa du khách đến Phú Quốc. Định hướng tạo dấu ấn riêng này thể hiện rõ nhất GTCL nào của Sun Group?", "a": 2, "opts": ["Đẳng cấp", "Nhiệt tâm", "Khác biệt", "Chất lượng"], "group": "NQ126 – Chương 3"}, {"q": "Theo văn hóa Tập đoàn, Triết lý Sun Group bao gồm những nội dung gì?", "a": 3, "opts": ["Triết lý con người; Triết lý hoạt động; Triết lý xây dựng", "Triết lý về Người Sun Group; Triết lý văn hóa; Triết lý xây dựng", "Triết lý kinh doanh; Triết lý hoạt động; Triết lý con người", "Triết lý về Người Sun Group; Triết lý hoạt động; Triết lý xây dựng và phát triển văn hóa"], "group": "NQ126 – Chương 3"}, {"q": "Theo Triết lý về Người Sun Group, yếu tố “TÀI” lấy điều gì làm thước đo cho sự bền vững của tập thể, của Sun Group, của cộng đồng và của đất nước Việt Nam?", "a": 1, "opts": ["Kết quả kinh doanh của đơn vị", "Sự trưởng thành liên tục của bản thân", "Mức độ đóng góp cho cộng đồng", "Dám chịu trách nhiệm đến cùng nhiệm vụ"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây là một trong những yêu cầu đối với Lãnh đạo và Quản lý Sun Group?", "a": 0, "opts": ["Luôn khẳng định vai trò Người đứng đầu với tầm nhìn chiến lược, tư duy làm chủ, thể hiện rõ nét tinh thần dám dấn thân, dám nghĩ, dám làm, biết làm và dám chịu trách nhiệm.", "Sun Group hướng tới xây dựng môi trường là nơi đến để sống, nơi luôn mang lại nguồn cảm hứng, sự yêu đời, yêu người cho mỗi Người Sun Group.", "Người Sun Group luôn cho rằng “Không có công việc tầm thường, chỉ có con người tầm thường”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn."], "group": "NQ126 – Chương 3"}, {"q": "Với các nhiệm vụ được giao dù có khó khăn, thách thức; mỗi thành viên Sun Group cần thể hiện tinh thần Nhiệt tâm của mình thế nào?", "a": 2, "opts": ["Tuân thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.", "Tin tưởng tuyệt đối, sẵn sàng đấu tranh và hy sinh lợi ích cá nhân để theo đuổi lý tưởng và khát vọng của Tập đoàn.", "Tiên phong đi đầu, dám nhận và chịu trách nhiệm đến cùng nhiệm vụ được giao.", "Sáng tạo, đổi mới, đảm bảo kết quả công việc đạt hiệu quả cao hơn."], "group": "NQ126 – Chương 3"}, {"q": "Trong Triết lý xây dựng văn hóa của Sun Group, yếu tố Hội nhập cho biết Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa hiện đại; điều này nhằm mục tiêu gì?", "a": 3, "opts": ["Đảo sự phát triển của Sun Group luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc", "Đảm bảo mỗi người Sun Group đều hiểu, cập nhật và tận dụng những thay đổi về công nghệ của thế giới vào các hoạt động sống và làm việc", "Đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện triết lý hoạt động nào của Sun Group? \"Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc để mỗi con người – không chỉ Người Sun Group, mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.\"", "a": 2, "opts": ["Triết lý về tinh thần tự hào Sun Group", "Triết lý về sự hài hòa", "Triết lý về lòng yêu nước", "Triết lý đứng trên vai người khổng lồ"], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Tầm nhìn Sun Group, các lĩnh vực đầu tư chiến lược của Sun Group là gì?", "a": 1, "opts": ["Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Tài chính Ngân hàng", "Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Đầu tư hạ tầng", "Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Biểu diễn Nghệ thuật", "Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản, Dịch vụ y tế"], "group": "NQ126 – Chương 3"}, {"q": "Theo GTCL Nhiệt tâm, cách ứng xử với đồng nghiệp được yêu cầu như thế nào?", "a": 1, "opts": ["Thẳng thắn phê bình và cùng tiến bộ", "Lắng nghe, đồng cảm, giúp đỡ, bảo vệ đồng nghiệp", "Ưu tiên hoàn thành mục tiêu cá nhân", "Cạnh tranh công bằng và tự chịu trách nhiệm"], "group": "NQ126 – Chương 3"}, {"q": "Theo Triết lý Hiền Tài, nội dung nào thuộc phẩm chất “HIỀN”?", "a": 1, "opts": ["Tạo lợi thế cạnh tranh độc đáo cho Việt Nam", "Vừa cống hiến hết mình, vừa sống chân thành, yêu thương và quan tâm đồng nghiệp", "Thông hiểu ít nhất một ngoại ngữ thông dụng", "Chủ động học hỏi để nâng cao năng lực chuyên môn"], "group": "NQ126 – Chương 3"}, {"q": "\"Người Sun Group không tự mãn với những thành công đã đạt được mà luôn khao khát phá vỡ những kỷ lục của chính mình, luôn đảm bảo chất lượng, đẳng cấp, khác biệt và tính nhân văn trong mọi việc, công trình sau tốt hơn công trình trước\"; Đây là nội dung thể hiện yếu tố nào trong Triết lý xây dựng và phát triển văn hóa của Sun Group?", "a": 0, "opts": ["Bản sắc", "Hội nhập", "Kế thừa", "Lan tỏa"], "group": "NQ126 – Chương 3"}, {"q": "Theo GTCL \"Trung thành và trung thực\", khi được giao nhiệm vụ, Người Sun Group cần hoàn thành như thế nào?", "a": 2, "opts": ["Triển khai một cách sáng tạo, linh hoạt, đổi mới và hoàn thành đúng deadline", "Hoàn thành trước deadline và đảm bảo có đầy đủ ý kiến của Đơn vị các cấp", "Hoàn thành đúng chất lượng và tiến độ cam kết", "Hoàn thành đạt chất lượng yêu cầu và đảm bảo có đầy đủ ý kiến của Đơn vị các cấp"], "group": "NQ126 – Chương 3"}, {"q": "Hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được các triết lý nào?", "a": 3, "opts": ["Triết lý về sự đẳng cấp; Triết lý về chất lượng; Triết lý về sự khác biệt.", "Triết lý về lòng yêu nước; Triết lý về sự nhân văn; Triết lý \"Đứng trên vai người khổng lồ\".", "Triết lý về sự nhân văn; Triết lý về sự hài hòa; Triết lý \"Đứng trên vai người khổng lồ\".", "Triết lý về lòng yêu nước; Triết lý về sự hài hòa; Triết lý \"Đứng trên vai người khổng lồ\"."], "group": "NQ126 – Chương 3"}, {"q": "Người Sun Group luôn chủ động lan tỏa các giá trị tốt đẹp tới đồng nghiệp để cùng nhau xây dựng tập thể Người Sun Group là đại diện của Người Việt Nam mới các đặc điểm gì?", "a": 0, "opts": ["Phẩm chất cao đẹp, có năng lực và trình độ chuyên môn cao, khỏe cả về thể chất và tinh thần", "Có lý tưởng, khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi những gì mình đang có, hướng tới những thay đổi vượt bậc và những giá trị tốt đẹp hơn", "Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao", "Khỏe mạnh về thể chất, có sức bền, sự dẻo dai, chịu được áp lực công việc cao, có thói quen rèn luyện thể dục thể thao đều đặn"], "group": "NQ126 – Chương 3"}, {"q": "Theo Triết lý về Người Sun Group, Hiền Tài của Sun Group thể hiện tinh thần làm gương và lan tỏa thông qua điều gì?", "a": 1, "opts": ["Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao", "Luôn hành động theo những GTCL của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp và là nguồn cảm hứng cho đồng nghiệp", "Nhiệt huyết, quyết tâm, dấn thân và chịu trách nhiệm đến cùng với công việc mình được giao; đồng thời luôn phối hợp tốt với đồng nghiệp", "Luôn sống lạc quan, tích cực, tràn đầy hi vọng, niềm vui và hạnh phúc"], "group": "NQ126 – Chương 3"}, {"q": "Để thể hiện GTCL Chất lượng, các sản phẩm và dịch vụ của Sun Group cần đảm bảo điều gì?", "a": 2, "opts": ["Kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có", "Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được", "Chất lượng hướng đến chuẩn mực quốc tế và bền vững với thời gian", "Sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế, giá trị sử dụng vượt trội"], "group": "NQ126 – Chương 3"}, {"q": "Thể hiện GTCL Đẳng cấp, Sun Group tiên phong kiến tạo những chuẩn mực như thế nào về sản phẩm/dịch vụ?", "a": 0, "opts": ["Mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có", "Gắn với sự phát triển bền vững, gìn giữ môi trường sống ổn định, xanh, sạch và văn minh", "Hướng đến chuẩn mực chung của thị trường", "Độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ"], "group": "NQ126 – Chương 3"}, {"q": "Tại Capella Hanoi, mỗi phòng nghỉ kể một câu chuyện về huyền thoại opera qua thiết kế và kỷ vật nghệ thuật, mang đến trải nghiệm lưu trú đậm chất cá nhân. Điều đó thể hiện rõ nhất giá trị văn hóa nào của Sun Group?", "a": 3, "opts": ["Chất lượng", "Triết lý về lòng yêu nước", "Trình độ chuyên môn cao", "Khác biệt"], "group": "NQ126 – Chương 3"}, {"q": "Thể hiện GTCL Khác biệt, Sun Group hướng đến yếu tố gì trong trong sản phẩm/dịch vụ?", "a": 1, "opts": ["Hướng đến chuẩn mực quốc tế và bền vững với thời gian", "Sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được", "Mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có", "Gắn với sự phát triển bền vững, gìn giữ môi trường sống ổn định, xanh, sạch và văn minh"], "group": "NQ126 – Chương 3"}, {"q": "Người Sun Group luôn có thái độ chia sẻ, hỗ trợ và thẳng thắn góp ý trên tinh thần xây dựng; tự hào, hạnh phúc với thành công của đồng nghiệp và cấp dưới bởi Người Sun Group hiểu rõ điều gì?", "a": 2, "opts": ["Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi", "Không có công việc tầm thường, chỉ có con người tầm thường", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn", "Ngước lên cao để thấy mình còn thấp, nhìn xuống thấp để biết mình chưa cao"], "group": "NQ126 – Chương 3"}, {"q": "Phê và tự phê là hoạt động mang bản sắc riêng của Người Sun Group và luôn được triển khai thực chất, chân thành; hoạt động này nhằm đẩy mạnh GTCL nào?", "a": 2, "opts": ["Đẳng cấp", "Trung thành và trung thực", "Trình độ chuyên môn cao", "Khác biệt"], "group": "NQ126 – Chương 3"}, {"q": "Theo Triết lý về Người Sun Group, trong yếu tố “Làm gương và lan tỏa” Hiền tài của Sun Group sẽ hành động theo điều gì?", "a": 2, "opts": ["Chuẩn mực của từng lĩnh vực đầu tư", "Mục tiêu kinh doanh của đơn vị", "GTCL của Người Sun Group", "Triết lý hoạt động của Tập đoàn"], "group": "NQ126 – Chương 3"}, {"q": "Triết lý về Người Sun Group đã định nghĩa rõ về tiêu chí HIỀN và TÀI; theo đó tiêu chí HIỀN được mô tả như thế nào?", "a": 2, "opts": ["Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao", "Luôn hành động theo những GTCL của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp", "Vừa sống khiêm nhường, trung thực, tự trọng vừa hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng", "Sống văn minh, cởi mở học hỏi, hoàn thiện bản thân để theo kịp với thời cuộc và sự phát triển của tổ chức, của xã hội"], "group": "NQ126 – Chương 3"}, {"q": "Trong triết lý xây dựng và phát triển văn hóa, với yếu tố \"Bản sắc'', Người Sun Group luôn đặt tiêu chí gì lên hàng đầu?", "a": 2, "opts": ["Dấn thân", "Học hỏi", "Kỷ luật", "Sáng tạo"], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung về Lý tưởng Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"Lý tưởng của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới những bến bờ vinh quang bằng những công trình….\".", "a": 1, "opts": ["Đẳng cấp, chất lượng, khác biệt.", "Ghi dấu ấn vượt thời gian.", "Có đẳng cấp quốc tế.", "Hàng đầu Việt Nam."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung về Lý tưởng Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"Lý tưởng của Sun Group là cùng chung …, cùng … đưa Sun Group tới những bến bờ vinh quang bằng những công trình ghi dấu ấn vượt thời gian\".", "a": 2, "opts": ["Một chuyến xe; một con đường.", "Một chiến lược; một Lãnh đạo.", "Một con thuyền; người cầm lái.", "Một con thuyền; một đội ngũ."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung về Lý tưởng Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"Lý tưởng của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới …. bằng những công trình ghi dấu ấn vượt thời gian\".", "a": 0, "opts": ["Những bến bờ vinh quang.", "Đích.", "Những bến bờ hạnh phúc.", "Sự trường tồn."], "group": "NQ126 – Chương 3"}, {"q": "Sun Group mang trên mình sứ mệnh gì để luôn kiên định với mục tiêu tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn với thời gian?", "a": 3, "opts": ["Người yêu nước", "Hạt giống tốt", "Hiền tài", "Người Khai Mở"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là \"Góp phần xây dựng … với phẩm chất, năng lực, kỹ năng, tri thức bắt kịp với thời cuộc.\". Từ còn thiếu trong dấu ba chấm là gì?", "a": 0, "opts": ["Người Việt Nam mới.", "Người Hiền Tài.", "Người Tài.", "Người Sun Group mới"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ thế nào?", "a": 3, "opts": ["Đẳng cấp, chất lượng, khác biệt.", "Ghi dấu ấn vượt thời gian.", "Chất lượng vượt trội", "Đẳng cấp chất lượng vượt trội, trường tồn theo thời gian"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là gì?", "a": 2, "opts": ["Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".", "Kiên quyết đấu tranh chống lại sự vô cảm, vô tâm và thiếu trách nhiệm với những nghĩa vụ phải hoàn thành.", "Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội và trường tồn theo thời gian", "Triệt để thực hiện tinh thần tiết kiệm, chống lãng phí, nêu cao khẩu hiệu \"Lãng phí là tội ác\"."], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là gì?", "a": 3, "opts": ["Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".", "Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế, lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược.", "Đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng.", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến như thế nào?", "a": 0, "opts": ["Hấp dẫn của thế giới.", "Hấp dẫn nhất thế giới", "Có nhiều công trình ghi dấu ấn vượt thời gian.", "Có nhiều công trình kỷ lục thế giới."], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là \"Góp phần nâng cao …., nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.\". Từ còn thiếu trong dấu ba chấm là gì?", "a": 1, "opts": ["Sức khỏe", "Vị thế đất nước", "Tài sản đất nước", "Vị thế của người Việt Nam"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là góp phần xây dựng con người Việt Nam mới với những đặc điểm gì?", "a": 2, "opts": ["Văn minh, chuyên nghiệp, nhân văn", "Yêu nước, kỷ luật, giỏi chuyên môn", "Phẩm chất, năng lực và sức khỏe bắt kịp thời cuộc", "Trung thành, trung thực, nhiệt tâm"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây phản ánh KHÔNG ĐÚNG \"Tầm nhìn\" của Sun Group?", "a": 3, "opts": ["Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế; lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược.", "Luôn thuộc nhóm các công ty dẫn đầu trong lĩnh vực đầu tư mà Sun Group tham gia", "Tiên phong trong việc xây dựng văn hóa du lịch: văn minh, chuyên nghiệp và nhân văn ở Việt Nam", "Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền."], "group": "NQ126 – Chương 3"}, {"q": "\"Người Sun Group sẽ luôn khẳng định vai trò Người đứng đầu với tầm nhìn chiến lược, tư duy làm chủ, thể hiện rõ nét tinh thần dám dấn thân, dám nghĩ, dám làm, biết làm và dám chịu trách nhiệm với nhiệm vụ mình được giao và kết quả của đơn vị, đội nhóm mà mình phụ trách\", nội dung này thể hiện vai trò của ai?", "a": 2, "opts": ["Lãnh đạo.", "Quản lý.", "Lãnh đạo và Quản lý.", "Người Việt Nam mới."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Tầm nhìn Sun Group, Sun Group tiên phong xây dựng văn hóa du lịch bao gồm những yếu tố gì?", "a": 3, "opts": ["Văn hóa, văn minh, chuyên nghiệp, nhân văn", "Bài bản, thân thiện, chuyên nghiệp, nhân văn", "Bài bản, văn minh, chuyên nghiệp, lan tỏa", "Văn minh, chuyên nghiệp, nhân văn"], "group": "NQ126 – Chương 3"}, {"q": "\"Người Sun Group trung thành với lý tưởng, tầm nhìn, sứ mệnh của Tập đoàn, đặt tiêu chí kỷ luật lên hàng đầu, luôn sẵn sàng làm việc trong môi trường áp lực và tự tạo áp lực để tôi luyện tinh thần đương đầu với khó khăn thử thách\" -đây là một trong các nội dung của yếu tố văn hóa nào của Sun Group?", "a": 3, "opts": ["Kế thừa", "Hội nhập", "Lan tỏa", "Bản sắc"], "group": "NQ126 – Chương 3"}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là \"Góp phần nâng cao vị thế đất nước, nâng cao ..., làm đẹp, làm giàu cho Tổ Quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.\". Từ còn thiếu trong dấu ba chấm là gì?", "a": 1, "opts": ["Vị thế của người Việt Nam", "Chất lượng sống của người dân", "Trí tuệ người Việt Nam", "Sức khỏe người Việt Nam"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG thể hiện sứ mệnh Sun Group?", "a": 1, "opts": ["Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.", "Sun Group sẽ tập hợp về mình những \"Hiền Tài\" thay vì \"Người Tài\".", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.", "Góp phần xây dựng con người Việt Nam mới với phẩm chất, năng lực, kỹ năng, tri thức bắt kịp với thời cuộc."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Đảm bảo chất lượng sản phẩm và dịch vụ hướng dến chuẩn mực quốc tế và bền vững với thời gian.\"?", "a": 0, "opts": ["Chất lượng", "Đẳng cấp", "Khác biệt", "Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện giá trị cốt lõi \"Chất lượng\" của Tập đoàn Sun Group?", "a": 0, "opts": ["Phát triển hướng tới những thế hệ mai sau, nuôi dưỡng và gìn giữ môi trường sống ổn định, xanh, sạch và văn minh.", "Tiên phong kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có.", "Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ.", "Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Hướng đến sự độc đáo riêng có hoặc hiếm có, khó có thể sao chép được trong sản phẩm/dịch vụ\"?", "a": 2, "opts": ["Chất lượng", "Đẳng cấp", "Khác biệt", "Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG phải là giá trị cốt lõi đối với Người Sun Group?", "a": 3, "opts": ["Trung thành và trung thực.", "Nhiệt tâm.", "Trình độ chuyên môn cao.", "Đẳng cấp."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện giá trị cốt lõi \"Chất lượng\" của Tập đoàn Sun Group?", "a": 1, "opts": ["Đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn.", "Đảm bảo chất lượng sản phẩm và dịch vụ hướng đến chuẩn mực quốc tế và bền vững với thời gian.", "Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích và sự phát triển của cộng đồng và Người Sun Group.", "Sản phẩm/dịch vụ sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế và giá trị sử dụng vượt trội so với thị trường chung trong lĩnh vực hoạt động và được công nhận bởi các tổ chức quốc tế có uy tín."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Sản phẩm/dịch vụ nhận được sự ghi nhận và trân trọng của cộng đồng trong nước và quốc tế\"?", "a": 1, "opts": ["Chất lượng", "Đẳng cấp", "Khác biệt", "Không thể hiện giá trị cốt lõi nào đối với Tập đoàn."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG thể hiện giá trị cốt lõi \"Đẳng cấp\" của Tập đoàn Sun Group?", "a": 3, "opts": ["Tôn trọng và vì con người, mang lại giá trị phục vụ lợi ích, sự phát triển của cộng đồng và Người Sun Group.", "Tiên phong kiến tạo những chuẩn mực về sản phẩm/dịch vụ mới mẻ, cao cấp và vượt trội hơn những chuẩn mực mà thị trường đang có.", "Sản phẩm/dịch vụ sang trọng, có tính thẩm mỹ, ý nghĩa sâu sắc, giá trị kinh tế, giá trị sử dụng vượt trội so với thị trường chung trong lĩnh vực hoạt động, được công nhận bởi các t thủ mọi chuẩn mực của Tập đoàn và hoàn thành mọi nhiệm vụ được giao đúng chất lượng và tiến độ cam kết.", "Lạc quan, tích cực, luôn tràn đầy hi vọng, niềm vui và hạnh phúc."], "group": "NQ126 – Chương 3"}, {"q": "Giá trị cốt lõi đối với Người Sun Group là gì?", "a": 1, "opts": ["Trung thành; Trung thực; Nhiệt tâm.", "Trung thành và trung thực; Nhiệt tâm; Trình độ chuyên môn cao.", "Trung thành; Sáng tạo; Nhiệt tâm.", "Trung thành và trung thực; Nhiệt tình; Trình độ chuyên môn cao."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Tinh thần của Người Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"...… của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.\"", "a": 2, "opts": ["Lý tưởng.", "Sứ mệnh.", "Hạnh phúc.", "Niềm vui."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện Lý tưởng Sun Group?", "a": 0, "opts": ["Lý tưởng của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới những bến bờ vinh quang bằng những công trình ghi dấu ấn vượt thời gian.", "Lý tưởng của Sun Group là tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.", "Lý tưởng của Sun Group là góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.", "Lý tưởng của Sun Group là trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế."], "group": "NQ126 – Chương 3"}, {"q": "\"Chất lượng - Đẳng cấp - Khác biệt\" thể hiện nội dung gì trong Tư tưởng - Văn hóa Sun Group?", "a": 3, "opts": ["Lý tưởng Sun Group.", "Sứ mệnh Sun Group.", "Tầm nhìn Sun Group.", "Giá trị cốt lõi đối với Tập đoàn Sun Group."], "group": "NQ126 – Chương 3"}, {"q": "Tiêu chí nào sau đây nằm trong Triết lý về Người Sun Group?", "a": 0, "opts": ["Sun Group sẽ tập hợp về mình những \"Hiền tài\" thay vì \"Người tài\".", "Sun Group sẵn sàng đón nhận những người đến với Tập đoàn chỉ vì tiền và giữ người bằng tiền.", "Sun Group sẽ chỉ chú trọng tập hợp về mình những \"Người tài\".", "Sun Group xây dựng môi trường làm việc áp lực, đòi hỏi cao để giúp CBNV nâng cao năng lực của mình."], "group": "NQ126 – Chương 3"}, {"q": "Tôn chỉ về sự phát triển của Sun Group là gì?", "a": 0, "opts": ["Phát triển bền vững", "Phát triển hài hòa", "Phát triển nhanh, mạnh và hài hòa", "Phát triển nhanh mạnh và dẫn đầu mọi lĩnh vực đầu tư mà Sun Group tham gia"], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Đối với cá nhân Người Sun Group dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"Người Sun Group luôn chủ động lan tỏa các giá trị tốt đẹp đó tới đồng nghiệp để cùng nhau xây dựng Tập thể Người Sun Group là đại diện của ...... với phẩm chất cao đẹp, có năng lực và trình độ chuyên môn cao, có sức khỏe tốt cả về thể chất và tinh thần. \"", "a": 0, "opts": ["Người Việt Nam mới.", "Con người mới.", "Người tài.", "Hiền tài."], "group": "NQ126 – Chương 3"}, {"q": "\"Hiền tài của Sun Group hiểu được tầm quan trọng của văn hóa mang đậm bản sắc Sun Group đối với sự phát triển bền vững của Sun Group trong tương lai lâu dài. Do đó, họ luôn hành động theo những giá trị cốt lõi của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp và là nguồn cảm hứng cho đồng nghiệp\". Đây là nội dung nào trong Triết lý về Người Sun Group?", "a": 0, "opts": ["Làm gương và lan tỏa", "Hiền", "Tài", "Nhân văn"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG thể hiện Triết lý về Người Sun Group?", "a": 2, "opts": ["Hiền tài của Sun Group hiểu được công việc tại Sun Group cũng chính là cuộc sống mà họ vừa cống hiến hết mình vừa sống chân thành, yêu thương, quan tâm tới đồng nghiệp.", "Hiền tài của Sun Group là những người hiểu được trách nhiệm và sự đóng góp của bản thân đối với sự thành công và lớn mạnh của Sun Group.", "Sun Group luôn xác định một tư tưởng “Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền”.", "Hiền tài của Sun Group hiểu được tầm quan trọng của văn hóa mang đậm bản sắc Sun Group đối với sự phát triển bền vững của Sun Group trong tương lai lâu dài."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Đối với cá nhân Người Sun Group, Người Sun Group phấn đấu trở thành “….....” thay vì “Người tài”. Từ còn thiếu trong dấu ba chấm là gì?", "a": 3, "opts": ["Người Việt Nam mới.", "Con người mới.", "Người tốt.", "Hiền tài."], "group": "NQ126 – Chương 3"}, {"q": "\"Hiền tài của Sun Group là những người hiểu được trách nhiệm và sự đóng góp của bản thân đối với sự thành công và lớn mạnh của Sun Group. Do đó, họ chủ động học hỏi, nỗ lực hoàn thiện bản thân và luôn xem sự trưởng thành liên tục của bản thân là yếu tố nền tảng và thước đo cho sự bền vững của tập thể, của Sun Group, của cộng đồng và của đất nước Việt Nam.\" Đây là nội dung nào trong Triết lý về Người Sun Group?", "a": 2, "opts": ["Làm gương và lan tỏa", "Hiền", "Tài", "Nhiệt tâm"], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung dưới đây, từ còn thiếu trong dấu ba chấm là gì? \"... của Sun Group là cùng chung một con thuyền, cùng người cầm lái đưa Sun Group tới những bến bờ vinh quang bằng những công trình ghi dấu ấn vượt thời gian\".", "a": 0, "opts": ["Lý tưởng.", "Sứ mệnh.", "Niềm tin.", "Văn hóa."], "group": "NQ126 – Chương 3"}, {"q": "Trong triết lý về Người Sun Group,\"Hiền tài\" của Sun Group được định nghĩa là người như thế nào?", "a": 1, "opts": ["Là những người \"vừa hồng vừa chuyên\".", "Là những người \"vừa hồng vừa chuyên\" - vừa có đức vừa có tài - Vừa có nhân cách tốt vừa có năng lực chuyên môn giỏi.", "Là những người có thể chất khỏe mạnh, tinh thần khỏe mạnh, lối sống lành mạnh", "Là những người vừa có nhân cách tốt vừa có năng lực chuyên môn giỏi."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây là một trong những yêu cầu đối với cá nhân Người Sun Group?", "a": 0, "opts": ["Cán bộ Lãnh đạo và Quản lý của Sun Group luôn biết thu phục và không ngại sử dụng những người giỏi hơn mình, chú trọng phát hiện và đào tạo cán bộ cấp dưới có năng lực trở thành cán bộ nguồn để sẵn sàng gánh vác và tiếp quản nhiệm vụ từ các thế hệ đi trước;", "Người Sun Group luôn cho rằng “Không có công việc tầm thường, chỉ có con người tầm thường”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.", "Sun Group hướng tới xây dựng môi trường lý tưởng để làm việc và vui sống, là nơi mang lại nguồn cảm hứng, sự yêu đời, yêu người cho mỗi Người Sun Group."], "group": "NQ126 – Chương 3"}, {"q": "Với tôn chỉ phát triển bền vững, một trong những mục tiêu chính Sun Group phấn đấu đạt được là gì?", "a": 2, "opts": ["Góp phần xây dựng con người Việt Nam mới với phẩm chất, năng lực, kỹ năng, tri thức bắt kịp với thời cuộc.", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.", "Trở thành một trong những Tập đoàn kinh tế tư nhân Việt Nam có quy mô và đẳng cấp quốc tế; lấy lĩnh vực Du lịch nghỉ dưỡng, Vui chơi giải trí, Bất động sản và Đầu tư hạ tầng làm lĩnh vực đầu tư chiến lược", "Kiên quyết đấu tranh chống lại sự vô cảm, vô tâm và thiếu trách nhiệm với những nghĩa vụ phải hoàn thành."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Đối với tập thể Người Sun Group dưới đây, câu còn thiếu trong dấu ba chấm là gì? \"Người Sun Group xác định, “............”, theo đó, mỗi cá nhân phấn đấu học hỏi và nâng cấp bản thân, phấn đấu trở thành Đại sứ Văn hóa Sun Group, khẳng định tình yêu với Tập đoàn và niềm tự hào khi là thành viên của Tập thể Sun Group, tập thể với lý tưởng cao đẹp đang góp phần xây dựng hình ảnh Người Việt Nam mới trong lao động, đóng góp cho sự phát triển của đất nước.\"", "a": 0, "opts": ["Sun Group là tập thể của những người con yêu nước.", "Không có công việc tầm thường, chỉ có con người tầm thường.", "Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.", "Phấn đấu trở thành “Hiền tài” thay vì “Người tài”."], "group": "NQ126 – Chương 3"}, {"q": "Với tôn chỉ phát triển bền vững, một trong những mục tiêu chính Sun Group phấn đấu đạt được là gì?", "a": 0, "opts": ["Luôn thuộc nhóm các công ty dẫn đầu trong lĩnh vực đầu tư mà Sun Group tham gia.", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng cuộc sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.", "Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian.", "Cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Đối với tập thể Người Sun Group có nêu rõ Người Sun Group dù đang ở bất cứ vị trí nào, thực hiện bất cứ công việc nào cũng sẽ luôn nỗ lực hết mình để hoàn thành xuất sắc vai trò, nhiệm vụ của mình. Bởi lẽ, Người Sun Group luôn cho rằng “…..........”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.\" Câu còn thiếu trong dấu ba chấm là gì?", "a": 1, "opts": ["Sun Group là tập thể của những người con yêu nước.", "Không có công việc tầm thường, chỉ có con người tầm thường.", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.", "Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG thể hiện Tinh thần của Người Sun Group?", "a": 3, "opts": ["Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.", "Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.", "Thắng không kiêu, bại không nản"], "group": "NQ126 – Chương 3"}, {"q": "Với triết lý về lòng yêu nước, hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được điều gì?", "a": 3, "opts": ["Đảm bảo sự phát triển của Sun Group là luôn tối đa hóa lợi nhuận nằm nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc.", "Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc.", "Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, tối đa hóa lợi nhuận nằm nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, góp phần làm cho mỗi con người không chỉ Sun Group mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.", "Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc để mỗi con người – không chỉ Người Sun Group, mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới."], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung về Tinh thần của Người Sun Group dưới đây, câu còn thiếu trong dấu ba chấm là gì? Với tinh thần “......”, Sun Group luôn xác định một tư tưởng “......” vì người Sun Group hiểu rằng, mỗi bước đi của Người Sun Group là những bước đi hạnh phúc nhằm thực hiện những mục tiêu và lý tưởng cao đẹp, nhân văn của bản thân và của Tập đoàn.", "a": 0, "opts": ["Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến; Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.", "Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi; Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền.", "Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến; Không có công việc tầm thường, chỉ có con người tầm thường.", "Người Sun Group luôn phấn đấu trở thành “Hiền tài” thay vì “Người tài”; Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi."], "group": "NQ126 – Chương 3"}, {"q": "Với triết lý về sự hài hòa, hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được điều gì?", "a": 3, "opts": ["Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên và con người, khai thác hiệu quả tiềm năng thiên nhiên và hướng tới sự hài lòng tối đa của khách hàng.", "Sự cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên và con người và hướng tới sự hài lòng của khách hàng.", "Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, khai thác hiệu quả các giá trị của thiên nhiên và con người, và hướng tới sự hài lòng tối đa của khách hàng.", "Sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với bảo tồn, tôn trọng các giá trị của thiên nhiên, con người và hướng tới sự hài lòng tối đa của khách hàng"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện triết lý \"Đứng trên vai những người khổng lồ\" của Sun Group?", "a": 0, "opts": ["Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới._x000D_", "Đảm bảo sự phát triển của mình luôn có sự đồng hành của các cơ quan nhà nước và các Công ty/Tập đoàn lớn ở Việt Nam.", "Đảm bảo sự phát triển của mình luôn có sự đồng hành của những người nổi tiếng, có uy tín trong mọi lĩnh vực trên thế giới.", "Đảm bảo sự phát triển của mình luôn có sự đồng hành của những nhân sự tốt nhất thế giới trong các lĩnh vực mình tham gia."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện triết lý hoạt động nào của Sun Group? \"Đảm bảo sự phát triển của Sun Group là luôn nhằm việc nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ Quốc, góp phần làm cho mỗi con người không chỉ Sun Group mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.\"", "a": 1, "opts": ["Triết lý về sự hài hòa", "Triết lý về lòng yêu nước", "Triết lý \"Đứng trên vai những người khổng lồ\"", "Triết lý về tinh thần học hỏi"], "group": "NQ126 – Chương 3"}, {"q": "Một trong các triết lý hoạt động của Sun Group là gì?", "a": 2, "opts": ["Triết lý về sự nhân văn", "Triết lý về sự khác biệt", "Triết lý về sự hài hòa", "Triết lý về sự sáng tạo"], "group": "NQ126 – Chương 3"}, {"q": "Trong nội dung Triết lý về sự hài hòa: \"đảm bảo sự hài hòa giữa lợi ích doanh nghiệp và lợi ích cộng đồng, cân bằng giữa phát triển với ....., tôn trọng các giá trị của thiên nhiên, con người và hướng tới sự hài lòng tối đa của khách hàng\"; từ còn thiếu trong dấu ba chấm là gì?", "a": 2, "opts": ["Gìn giữ", "Khai thác", "Bảo tồn", "Tái tạo"], "group": "NQ126 – Chương 3"}, {"q": "Hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được mấy triết lý?", "a": 2, "opts": ["1", "2", "3", "4"], "group": "NQ126 – Chương 3"}, {"q": "Yêu cầu đối với Người Sun Group trong thời kỳ mới cần hội tụ những yếu tố gì?", "a": 0, "opts": ["Phẩm chất - Năng lực - Sức khỏe.", "Yêu nước - Lý tưởng - Khiêm nhường.", "Nhân cách tốt - Ý thức tốt - Sức khỏe tốt.", "Năng suất lao động cao - Sức khỏe tốt - Biết cảm nhận nghệ thuật."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây KHÔNG PHẢI là triết lý hoạt động của Sun Group?", "a": 0, "opts": ["Triết lý về sự nhân văn", "Triết lý về lòng yêu nước", "Triết lý về sự hài hòa", "Triết lý \"Đứng trên vai những người khổng lồ\""], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện một trong các yếu tố về Phẩm chất của Người Sun Group trong thời kì mới?", "a": 0, "opts": ["Có tinh thần yêu nước, tự hào chia sẻ và hành động để gìn giữ những truyền thống của dân tộc Việt Nam: đoàn kết, cần cù, tiết kiệm, chịu khó, cầu tiến, ham học hỏi.", "Khỏe mạnh về thể chất, có sức bền, sự dẻo dai, chịu được áp lực công việc cao, có thói quen rèn luyện thể dục thể thao đều đặn.", "Tìm hiểu, lựa chọn thưởng thức nhằm nâng cao khả năng cảm thụ về các loại hình nghệ thuật.", "Lạc quan, tích cực, luôn tràn đầy hi vọng, niềm vui và hạnh phúc."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Phẩm chất của Người Sun Group trong thời kì mới? \"Có lý tưởng, khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi những gì mình đang có, hướng tới những thay đổi vượt bậc và những giá trị tốt đẹp hơn.\"", "a": 1, "opts": ["Yêu nước.", "Lý tưởng.", "Khiêm nhường.", "Nhân cách tốt."], "group": "NQ126 – Chương 3"}, {"q": "Từ còn thiếu trong dấu ba chấm sau đây là gì? \"Triết lý ….: Đảm bảo sự phát triển của mình luôn có sự đồng hành của những tập đoàn lớn, những cá nhân có tên tuổi và uy tín, các công trình luôn gắn với các thương hiệu lớn trên thế giới.\"", "a": 2, "opts": ["Về lòng yêu nước", "Về sự hài hòa", "Đứng trên vai người khổng lồ", "Phát triển bền vững"], "group": "NQ126 – Chương 3"}, {"q": "Đối với triết lý Xây dựng và phát triển văn hóa, Sun Group kiên định với các yếu tố nào?", "a": 0, "opts": ["Kế thừa; Hội nhập; Bản sắc; Lan tỏa", "Đẳng cấp; Chất lượng; Khác biệt", "Trung thành và Trung thực; Nhiệt tâm; Trình độ chuyên môn cao", "Yêu nước; Hài hòa; Đứng trên vai người khổng lồ"], "group": "NQ126 – Chương 3"}, {"q": "Văn hóa Sun Group được chắt lọc và kế thừa từ những giá trị tốt đẹp của văn hóa nào?", "a": 3, "opts": ["Văn hóa các nước Châu Á", "Văn hóa mới trong thời kỳ hội nhập của Việt Nam", "Văn hóa đa dạng của các nước trên thế giới", "Văn hóa truyền thống dân tộc Việt Nam"], "group": "NQ126 – Chương 3"}, {"q": "Yêu cầu về Năng lực (Kiến thức – Kỹ năng – Kinh nghiệm) của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?", "a": 0, "opts": ["Năng lực cạnh tranh - Năng suất lao động - Tư duy hội nhập - Ý thức vì cộng đồng - Cảm thụ nghệ thuật.", "Năng lực cạnh tranh - Tư duy hội nhập - Cảm thụ nghệ thuật.", "Năng suất lao động cao - Sức khỏe tốt - Biết cảm nhận nghệ thuật.", "Nhân cách tốt - Ý thức tốt - Sức khỏe tốt."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Năng lực của Người Sun Group trong thời kì mới? \"Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao; có năng suất lao động cao, ngang bằng nước tiên tiến nhất trong khu vực Đông Nam Á.\"", "a": 1, "opts": ["Năng lực cạnh tranh.", "Năng suất lao động.", "Ý thức vì cộng đồng.", "Cảm thụ nghệ thuật."], "group": "NQ126 – Chương 3"}, {"q": "Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa nào nhằm đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới?", "a": 0, "opts": ["Văn hóa hiện đại", "Văn hóa truyền thống", "Văn hóa nước ngoài", "Văn hóa học hỏi"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Năng lực của Người Sun Group trong thời kì mới? \"Thích nghi, nắm bắt rõ văn hóa quốc gia, vùng miền, tổ chức để gia tăng cơ hội hội nhập; thông hiểu và thuần thục ít nhất một ngoại ngữ thông dụng để nâng cao khả năng hội nhập\"", "a": 2, "opts": ["Năng lực cạnh tranh.", "Năng suất lao động.", "Tư duy hội nhập.", "Cảm thụ nghệ thuật."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Năng lực của Người Sun Group trong thời kì mới? \"Tìm hiểu, lựa chọn thưởng thức nhằm nâng cao khả năng cảm thụ về các loại hình nghệ thuật.\"?", "a": 3, "opts": ["Năng lực cạnh tranh.", "Năng suất lao động.", "Tư duy hội nhập.", "Cảm thụ nghệ thuật."], "group": "NQ126 – Chương 3"}, {"q": "Yếu tố Lan tỏa trong Triết lý xây dựng và phát triển Văn hóa Sun Group được thể hiện ra sao?", "a": 0, "opts": ["Không group": "NQ126 – Chương 3"}, {"q": "“Trách nhiệm của Sun Group, không chỉ lan tỏa các giá trị tốt đẹp trong nội bộ Tập đoàn mà bằng những hành động cụ thể, góp phần lan tỏa những giá trị văn hóa tới đối tác, cộng đồng, hướng tới mục tiêu xây dựng xã hội ngày một tốt đẹp và nhân văn hơn” Đây là nội dung của yếu tố văn hóa nào của Sun Group?", "a": 2, "opts": ["Kế thừa", "Hội nhập", "Lan tỏa", "Bản sắc"], "group": "NQ126 – Chương 3"}, {"q": "\"Không hút thuốc, hạn chế rượu bia, biết thụ hưởng và cân bằng công việc và cuộc sống.\" - là một trong các yêu cầu của yếu tố nào trong Sức khỏe của Người Sun Group trong thời kỳ mới?", "a": 2, "opts": ["Nhân cách tốt.", "Tư duy hội nhập.", "Lối sống lành mạnh.", "Ý thức vì cộng đồng."], "group": "NQ126 – Chương 3"}, {"q": "\"Văn hóa Sun Group được chắt lọc, kế thừa những giá trị tốt đẹp của văn hóa truyền thống dân tộc Việt Nam.\" Đây là nội dung của yếu tố văn hóa nào của Sun Group?", "a": 0, "opts": ["Kế thừa", "Hội nhập", "Lan tỏa", "Bản sắc"], "group": "NQ126 – Chương 3"}, {"q": "CBLĐ/CBQL Sun Group bên cạnh việc là tấm gương về tinh thần kỷ luật, thể hiện rõ nét vai trò/trách nhiệm của người đứng đầu; biết lắng nghe, khích lệ, truyền cảm hứng để đội ngũ cùng chung vai góp sức đạt mục tiêu chung thì còn cần thể hiện điều gì?", "a": 2, "opts": ["Là niềm tin - chỗ dựa cho nhân viên, bao bọc cho nhân viên nếu mắc lỗi sai; động viên đội ngũ khi nỗ lực hết sức mà kết quả chưa tốt", "Là tấm gương về năng lực chuyên môn vượt trội để có thể hướng dẫn cho nhân viên những kỹ thuật sâu trong chuyên môn mà nhân viên chưa giỏi", "Là chỗ dựa cho nhân viên - lực đẩy cho sự phát triển của tổ chức", "Là niềm tin - chỗ dựa cho nhân viên, luôn thể hiện sự nhân văn, yêu thương với CBNV trong mọi hoàn cảnh"], "group": "NQ126 – Chương 3"}, {"q": "Người Sun Group luôn sống khiêm nhường, thực chất, giản dị với triết lý nào?", "a": 3, "opts": ["Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn.", "Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi.", "Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.", "Ngước lên cao để thấy mình còn thấp, nhìn xuống thấp để biết mình chưa cao."], "group": "NQ126 – Chương 3"}, {"q": "Người Sun Group phấn đấu trở thành “Hiền Tài” thay vì “Người tài”; đảm bảo hội tụ đủ các giá trị cốt lõi “Trung thành và trung thực – Nhiệt tâm – Trình độ chuyên môn cao” và cần thể hiện điều gì?", "a": 1, "opts": ["Thể hiện khả năng lan tỏa, truyền cảm hứng mọi lúc, mọi nơi", "Thể hiện các giá trị cốt lõi bằng hành vi cụ thể", "Thể hiện tinh thần sẻ chia, thông cảm với các hạn chế và yếu điểm của đồng nghiệp", "Thể hiện khả năng cảm thụ về các loại hình nghệ thuật"], "group": "NQ126 – Chương 3"}, {"q": "Người Sun Group xác định, “Sun Group là tập thể của những người con yêu nước”, theo đó, mỗi cá nhân phấn đấu học hỏi và nâng cấp bản thân, phấn đấu trở thành hình mẫu nào?", "a": 0, "opts": ["Đại sứ Văn hóa Sun Group", "Cán bộ nguồn", "Người Việt Nam mới", "CBLĐ/CBQL cấp 2+"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện Tư duy hội nhập của Người Sun Group trong thời kì mới?", "a": 1, "opts": ["Có năng suất lao động cao, ngang bằng nước tiên tiến nhất trong khu vực Đông Nam Á.", "Thích nghi, nắm bắt rõ văn hóa quốc gia, vùng miền, tổ chức để gia tăng cơ hội hội nhập.", "Có lối sống lành mạnh, không hút thuốc, hạn chế rượu bia, biết thụ hưởng và cân bằng công việc và cuộc sống.", "Có khả năng lan tỏa, truyền cảm hứng và gắn kết sức mạnh của đội ngũ."], "group": "NQ126 – Chương 3"}, {"q": "Nội dung nào sau đây thể hiện yếu tố Lan tỏa trong Triết lý xây dựng văn hóa của Sun Group?", "a": 1, "opts": ["Người Sun Group luôn chủ động lan tỏa các giá trị tốt đẹp đó tới đồng nghiệp để cùng nhau xây dựng tập thể Người Sun Group là đại diện của Người Việt Nam mới", "Không chỉ lan tỏa các giá trị tốt đẹp trong nội bộ Tập đoàn mà bằng những hành động cụ thể, góp phần lan tỏa những giá trị văn hóa tới đối tác, cộng đồng, hướng tới mục tiêu xây dựng xã hội ngày một tốt đẹp và nhân văn hơn", "Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc", "Tiên phong trong việc xây dựng văn hóa du lịch: văn minh, chuyên nghiệp và nhân văn ở Việt Nam"], "group": "NQ126 – Chương 3"}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Phẩm chất của Người Sun Group trong thời kì mới? \"Sống ngay thẳng, trung thực, lương thiện, yêu thương và quan tâm chân thành đến những người xung quanh.\"", "a": 0, "opts": ["Nhân cách tốt", "Nhân văn", "Khiêm nhường", "Yêu nước"], "group": "NQ126 – Chương 3"}, {"q": "Thấm nhuần triết lý “Hạt giống tốt chỉ nảy mầm và phát triển khi có môi trường thuận lợi”, Sun Group hướng tới xây dựng Môi trường làm việc như thế nào?", "a": 0, "opts": ["Môi trường làm việc Văn hóa – Nhân văn song hành với Trách nhiệm – Kỷ luật", "Môi trường làm việc văn hóa - nhân văn song hành cùng trung thành, gắn bó", "Môi trường làm việc đề cao sáng tạo và linh hoạt", "Môi trường làm việc áp lực và hiệu quả cao"], "group": "NQ126 – Chương 3"}, {"q": "Theo văn hóa Sun Group, nếu “Văn hóa” là sợi chỉ đỏ xuyên suốt, kết nối các Vùng/Khối/Ban chức năng và các Đơn vị thành viên Sun Group thì \"Tư tưởng\" được coi là gì trong việc định hướng phát triển?", "a": 1, "opts": ["Sợi chỉ đỏ", "Kim chỉ nam", "Hoa tiêu", "Điều kỳ diệu"], "group": "NQ126 – Chương 3"}, {"q": "Theo Chương 3 nghị quyết 126, Điền vào chỗ trống: Người Sun Group tin tưởng vào những việc mình làm, ____ và thúc đẩy người khác làm việc và sống tốt hơn.", "a": 1, "opts": ["Giám sát", "Truyền cảm hứng", "Hỗ trợ", "Quản lý"], "group": "NQ126 – Chương 3"}, {"q": "Yếu tố nào nói về việc Người Sun Group không tự mãn mà luôn khao khát phá vỡ kỷ lục của chính mình, công trình sau tốt hơn công trình trước?", "a": 2, "opts": ["Kế thừa", "Hội nhập", "Bản sắc", "Lan tỏa"], "group": "NQ126 – Chương 3"}, {"q": "Tinh thần của Người Sun Group về hạnh phúc , "SG Next"], "group": "NQ126 – Chương 4"}, {"q": "Trong NVTT số 03, loại dự án nào được nêu là cơ hội tạo đột phá trong dài hạn?", "a": 1, "opts": ["Dự án BT", "Dự án PPP", "Dự án BOT", "Dự án FDI"], "group": "NQ126 – Chương 4"}, {"q": "Theo NVTT về công tác Kinh doanh trong Nghị Quyết 126 của Tập đoàn, việc quản lý và kiểm soát chi phí hiệu quả nhằm mục tiêu gì?", "a": 1, "opts": ["Tăng chi phí marketing để mở rộng thị trường", "Đảm bảo hoàn thành các chỉ tiêu tài chính đồng thời thúc đẩy sự tăng trưởng bền vững", "Nâng tầm trải nghiệm khách hàng thông qua sản phẩm đẳng cấp, khác biệt", "Tăng giá bán sản phẩm"], "group": "NQ126 – Chương 4"}, {"q": "Theo Nghị quyết 126 của Tập đoàn, yêu cầu đối với NVTT về công tác Thanh tra - Kiểm soát là gì?", "a": 2, "opts": ["Tự động hóa công tác Thanh tra - Kiểm soát", "Đổi mới công tác Thanh tra - Kiểm soát thân thiện, hiệu quả", "Nâng cao năng lực và hoàn thiện hệ thống kiểm soát nội bộ", "Hoàn thiện hệ thống Thanh tra - Kiểm soát đáp ứng yêu cầu phát triển của Tập đoàn"], "group": "NQ126 – Chương 4"}, {"q": "Theo NVTT về công tác Kinh doanh trong Nghị Quyết 126 của Tập đoàn, vai trò của Hàng không trong hệ sinh thái Sun Group là gì?", "a": 3, "opts": ["Mở rộng hợp tác với các hãng hàng không quốc tế", "Chú trọng tăng trưởng lượt khách, doanh thu", "Phát triển thêm các tuyến bay quốc tế mới", "Là cầu nối đưa khách hàng tới các điểm đến trọng điểm của Tập đoàn, góp phần hoàn thành các mục tiêu kinh doanh, mang lại hành trình trải nghiệm khách hàng liền mạch và nhất quán."], "group": "NQ126 – Chương 4"}, {"q": "Theo Nghị quyết 126 của Tập đoàn, nội dung: \"Đẩy mạnh số hóa toàn diện hoạt động kiểm soát nhằm nâng cao tốc độ, minh bạch và khả năng cảnh báo cho các lĩnh vực trọng yếu\" là yêu cầu đối với NVTT nào?", "a": 2, "opts": ["Phát triển và đầu tư các Dự án trọng tâm, trọng điểm theo định hướng phát triển bền vững", "Đảm bảo nguồn nhân lực đáp ứng yêu cầu và nâng tầm công tác Quản trị nhân sự", "Nâng cao năng lực và hoàn thiện hệ thống kiểm soát nội bộ", "Đẩy mạnh triển khai Toàn dân làm văn hóa"], "group": "NQ126 – Chương 4"}, {"q": "Theo NVTT về công tác Nhân sự trong Nghị quyết 126 của Tập đoàn, hệ thống đánh giá và đãi ngộ được xây dựng gắn với yếu tố nào?", "a": 3, "opts": ["Năng suất lao động.", "Kết quả kinh doanh của Tập đoàn.", "Khả năng ứng dụng công nghệ trong công việc.", "Hiệu suất công việc và giá trị đóng góp."], "group": "NQ126 – Chương 4"}, {"q": "Theo Nghị quyết 126 của Tập đoàn, nội dung: “Lấy khách hàng làm trung tâm, kết nối trải nghiệm toàn hệ sinh thái thông qua triển khai các sáng kiến Chuyển đổi số, tập trung cá nhân hóa trải nghiệm, gia tăng mức độ hài lòng, gắn kết và giá trị vòng đời khách hàng, qua đó thúc đẩy hiệu quả kinh doanh tổng thể” là yêu cầu đối với Nhiệm vụ trọng tâm nào?", "a": 2, "opts": ["Phát triển và đầu tư các Dự án trọng tâm, trọng điểm theo định hướng phát triển bền vững", "Đảm bảo nguồn nhân lực đáp ứng yêu cầu và nâng tầm công tác Quản trị nhân sự", "Đẩy mạnh ứng dụng Chuyển đổi số - Công nghệ, chú trọng kết nối hệ sinh thái", "Tăng cường thâm canh, tối ưu hiệu quả kinh doanh hệ sinh thái"], "group": "NQ126 – Chương 4"}, {"q": "Theo NVTT về công tác Tư tưởng Văn hóa trong Nghị quyết 126 của Tập đoàn, các hoạt động đào tạo, truyền thông được triển khai nhằm mục tiêu gì?", "a": 2, "opts": ["Thúc đẩy tinh thần học tập, phát triển bản thân.", "Lan tỏa văn hóa sâu rộng cả bên trong và bên ngoài Tập đoàn.", "Củng cố nhận thức và lan tỏa tinh thần “Toàn dân làm văn hóa” tới toàn thể CBNV.", "Xây dựng môi trường làm việc hài hòa, đa dạng thế hệ và quốc tịch."], "group": "NQ126 – Chương 4"}, {"q": "Theo Nghị quyết 126 của Tập đoàn, định hướng của NVTT về công tác Phát triển & Đầu tư các dự án trọng tâm, trọng điểm là gì?", "a": 1, "opts": ["Định hướng Xanh.", "Định hướng phát triển bền vững.", "Tối ưu hiệu quả kinh doanh hệ sinh thái.", "Ghi dấu ấn vượt thời gian."], "group": "NQ126 – Chương 4"}, {"q": "Nội dung nào sau đây là yêu cầu đối với Nh ị thành viên Sun Group (ĐVTVSG), các cá nhân, đơn vị bên thứ ba tham gia vào các nghiệp vụ phát triển, vận hành, quản lý và sử dụng tài sản Công nghệ Thông tin (CNTT) của Sun Group", "Tất cả cán bộ nhân viên của Tập Đoàn Sun Group, bao gồm nhân viên toàn thời gian, bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn và đơn vị thành viên Sun Group (ĐVTVSG). Các cá nhân, đơn vị bên thứ ba tham gia vào các nghiệp vụ phát triển, vận hành, quản lý và sử dụng tài sản Công nghệ Thông tin (CNTT) của Sun Group không cần thiết phải tuân thủ quy định này", "Tất cả cán bộ nhân viên của Tập Đoàn Sun Group, bao gồm nhân viên toàn thời gian, bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn và đơn vị thành viên Sun Group (ĐVTVSG).", "Tất cả cán bộ nhân viên của Tập Đoàn Sun Group (không bao gồm nhân viên bán thời gian và nhân viên tạm thời đang làm việc tại Tập đoàn), các cá nhân, đơn vị bên thứ ba tham gia vào các nghiệp vụ phát triển, vận hành, quản lý và sử dụng tài sản Công nghệ Thông tin (CNTT) của Sun Group"], "group": "An ninh bảo mật thông tin"}, {"q": "Đâu là chính sách ANBM dành cho nhân sự?", "a": 1, "opts": ["CBNV phải ký cam kết bảo mật thông tin (NDA) ngay sau 2 tháng thử việc", "CBNV phải ký kết điều khoản về cam kết bảo mật thông tin với Sungroup trong và sau khi làm việc tại Sungroup. Quyền truy cập vào các tài sản CNTT phải được vô hiệu hóa ngay lập tức đối với nhân viên nghỉ việc", "Quyền truy cập vào các tài sản CNTT phải được vô hiệu hóa ngay lập tức đối với nhân viên nghỉ việc", "CBNV phải ký kết điều khoản về cam kết bảo mật thông tin với Sungroup trong và sau khi làm việc tại Sungroup"], "group": "An ninh bảo mật thông tin"}, {"q": "Anh/Chị cần cẩn trọng và cảnh giác khi nhận được những yêu cầu nào sau đây?", "a": 2, "opts": ["Yêu cầu đổi mật khẩu đã sắp hết hạn từ hệ thống gửi đến với địa chỉ đổi mật khẩu là https://matkhau.sungroup.com.vn", "Yêu cầu gửi báo cáo công việc được giao qua email công ty cho CBLĐ", "Yêu cầu thanh toán tiền gấp vào tài khoản mới từ đối tác hoặc yêu cầu mở tập tin đính kèm trong email từ những địa chỉ lạ", "Tất cả đáp án trên"], "group": "An ninh bảo mật thông tin"}, {"q": "Đơn vị làm gì khi chuyển quyền sở hữu máy tính từ một CBNV đã nghỉ việc sang cho CBNV mới tuyển dụng?", "a": 2, "opts": ["Vì CBNV mới tuyển dụng nhằm thay thế cho CBNV cũ đã nghỉ việc nên chuyển giao toàn bộ máy tính và dữ liệu trên máy tính của nhân viên cũ cho nhân viên mới cho thuận tiện", "Yêu cầu CBNV tại đơn vị thực hiện lệnh xóa dữ liệu \"Delete\" trên máy tính của CBNV cũ trước khi bàn giao sang CBNV mới tuyển dụng", "Yêu cầu và giám sát bộ phận CNTT tại đơn vị xóa đảm bảo không thể khôi phục đối với các dữ liệu thuộc nhóm \"mật\" và \"tuyệt mật\" trên máy tính trước khi chuyển", "Yêu cầu CBNV mới tuyển dụng ký cam kết bảo mật thông tin sau đó mới chuyển giao máy tính của CBNV cũ và dữ liệu trên máy tính cho CBNV mới"], "group": "An ninh bảo mật thông tin"}, {"q": "Một đồng nghiệp tải phần mềm không có bản quyền từ trên mạng và chia sẻ với anh/chị để cài đặt. Anh/Chị nên làm gì ?", "a": 2, "opts": ["Cài đặt phần mềm và sử dụng vì nhu cầu công việc đang cần gấp", "Cố gắng cài thử, nếu chương trình Antivirus phát hiện thì không dùng thôi !", "Từ chối và yêu cầu đồng nghiệp liên hệ với bộ phận CNTT để được hỗ trợ nhu cầu cài đặt phần mềm.", "Tất cả phương án trên"], "group": "An ninh bảo mật thông tin"}, {"q": "Chính sách nào sau đây là chính sách quản lý truy cập hệ thống mạng nội bộ của tập đoàn", "a": 1, "opts": ["Để đảm bảo công việc, Ban CNTT đảm bảo toàn bộ các CBNV/CBLĐ của tập đoàn đều khó thể truy cập từ xa vào hệ thống mạng nội bộ của Sungroup", "Việc thiết lập các truy cập từ xa vào hệ thống mạng nội bộ của Sun Group dựa trên nhu cầu công việc và phải được phê duyệt của lãnh đạo Đơn vị và LĐTĐ", "Khi có nhu cầu truy cập từ xa vào hệ thống mạng nội bộ của Sun Group, CBNV/CBLĐ gửi yêu cầu trực tiếp tới BCNTT Tập Đoàn yêu cầu hỗ trợ phân quyền truy cập đảm bảo kịp thời nhu cầu công việc", "Để đảm bảo tốc độ truy cập hệ thống nội bộ Sungroup, toàn bộ các hệ thống của Sungroup cần phải đưa ra internet từ đó không có phân biệt mạng nội bộ tập đoàn và mạng ngoài tập đoàn."], "group": "An ninh bảo mật thông tin"}, {"q": "Anh/Chị nhận được điện thoại của người xưng là Thanh tra Tập đoàn, yêu cầu cung cấp ngay mật khẩu đăng nhập máy tính phục vụ thanh tra. Anh/Chị sẽ làm gì trong trường hợp này?", "a": 3, "opts": ["Ngay lập tức cung cấp mật khẩu để tránh bị phiền hà.", "Cẩn thận xem lại có CBNV Tập đoàn có ai tên như vậy không, nếu đúng thì cung cấp ngay để tránh phiền hà", "Không chia sẻ mật khẩu qua điện thoại và thực hiện chia sẻ qua email", "Không chia sẻ thông tin mật khẩu"], "group": "An ninh bảo mật thông tin"}, {"q": "Sử dụng máy tính cá nhân để làm việc được quy định như thế nào?", "a": 3, "opts": ["Không sử dụng máy tính, thiết bị cá nhân phục vụ công việc.", "Trường hợp ngoại lệ phải được Cán bộ Lãnh đạo có thẩm quyền phê duyệt", "Máy tính cá nhân phải được cấu hình tuân thủ tất cả Quy định, tiêu chuẩn an ninh bảo mật của Sun Group và phải được Bộ phận CNTT kiểm tra trước khi kết nối vào mạng nội bộ", "Tất cả các đáp án trên"], "group": "An ninh bảo mật thông tin"}, {"q": "Thời gian hiệu lực tối đa cho các yêu cầu ngoại lệ (truy cập mạng xã hội, lưu trữ trực tuyến, chat...) là?", "a": 2, "opts": ["90 ngày", "180 ngày", "365 ngày", "Không giới hạn thời gian"], "group": "An ninh bảo mật thông tin"}, {"q": "Chính sách an ninh bảo mật thông tin quy định quy định việc sử dụng email như thế nào ?", "a": 0, "opts": ["Nghiêm cấm sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ...) để trao đổi thông tin trong quá trình xử lý công việc", "Nghiêm cấm sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ..) cho mục đích cá nhân", "Cho phép sử dụng tài khoản email khác ngoài hệ thống email của Sungroup (như Yahoo, Hotmail, Gmail ...) để trao đổi thông tin trong quá trình xử lý ấu hình tự động gửi/chuyển tiếp (auto-forward) các email nội bộ Sun Group ra các email bên ngoài hệ thống của Tập đoàn (gmail, yahoo...) hoặc đồng bộ dữ liệu từ hòm thư email công ty với hòm thư bên ngoài Internet", "Không được mở các link, tệp đính kèm từ email lạ hoặc không rõ nguồn gốc.", "Đặt mật khẩu cho file chứa thông tin được phân loại \"mật\" hoặc \"tuyệt mật\" khi gửi qua email"], "group": "An ninh bảo mật thông tin"}, {"q": "Anh/Chị bấm vào một đường dẫn trong email, trên màn hình hiện lên thông báo, dữ liệu trên máy đã bị mã hóa và yêu cầu trả tiền chuộc để lấy lại dữ liệu. Anh/Chị sẽ làm gì?", "a": 3, "opts": ["Không thông báo cho ai, tiếp tục làm việc bình thường vì dữ liệu đã lưu trên máy chủ", "Không thông báo cho ai, trả tiền chuộc theo yêu cầu để khôi phục lại dữ liệu bị mã hóa", "Chuyển tiếp email nhận được cho đồng nghiệp làm việc trong lĩnh vực CNTT ở cơ quan cũ để nhờ trợ giúp", "Dừng sử dụng, ngắt máy tính ra khỏi mạng và thông báo ngay cho bộ phận CNTT/ANBM"], "group": "An ninh bảo mật thông tin"}, {"q": "Anh/Chị nhận được email truyền thông về An Toàn Thông Tin từ bcntt@sungroup.com.vn. Khi nhận được mail này, Anh/Chị sẽ làm gì", "a": 2, "opts": ["Bỏ qua không đọc vì còn bận nhiều công việc khác", "Đợi CBLĐ có chỉ đạo rồi mới thực hiện.", "Đọc kỹ và nghiêm túc thực hiện theo các hướng dẫn trong email", "Đọc qua cho biết, chắc mấy việc đó không xảy ra với mình"], "group": "An ninh bảo mật thông tin"}, {"q": "Để tăng tính sẵn sàng của dữ liệu quan trọng, Anh/Chị cần thực hiện những hành động nào sau đây?", "a": 0, "opts": ["Lưu dữ liệu quan trọng định kỳ lên Data Room được quy hoạch của TĐ & ĐVTVSG", "Xóa các dữ liệu ít quan trọng hơn để còn nhiều dung lượng cho các dữ liệu quan trọng", "Lưu các dữ liệu quan trọng ra USB cá nhân", "Lưu các dữ liệu quan trọng ra các dịch vụ lưu trữ online các nhân trên Internet như GoogleDrive, DropBox..."], "group": "An ninh bảo mật thông tin"}, {"q": "Anh/Chị nhận được email dưới tên của Tổ chức Y tế thế giới  thuộc trách nhiệm của mình dẫn đến NLĐ cấp dưới trực tiếp thực hiện hành vi vi phạm bị áp dụng hình thức kỷ luật tương ứng với nhóm L5 thì CBLĐ/CBQL đó sẽ bị xử lý kỷ luật với hình thức:", "a": 3, "opts": ["Khiển trách", "Kéo dài thời hạn nâng lương không quá 06 tháng", "Sa thải", "Cách chức"], "group": "Nội quy lao động (rev 04)"}, {"q": "Sau một sự cố vận hành, người trực tiếp liên quan không có biểu hiện bất thường và cho rằng mình không sử dụng chất ma túy. Theo quy định, việc xét nghiệm được thực hiện thế nào?", "a": 1, "opts": ["Không cần xét nghiệm nếu không có dấu hiệu nghi vấn", "Phải xét nghiệm sau sự cố đối với người liên quan trực tiếp", "Chỉ xét nghiệm khi người quản lý có căn cứ nghi ngờ", "Chỉ xét nghiệm nếu cơ quan Công an yêu cầu"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Một CBNV phát hiện đồng nghiệp có dấu hiệu đáng ngờ liên quan đến chất ma túy nhưng chưa có bằng chứng chắc chắn. Cách xử lý phù hợp nhất là gì?", "a": 2, "opts": ["Thông báo rộng rãi cho đồng nghiệp để cùng theo dõi", "Tự xác minh và chỉ báo cáo khi có bằng chứng chắc chắn", "Báo cáo ngay qua kênh quy định khi có căn cứ nghi ngờ và bảo mật thông tin", "Không báo cáo vì có thể ảnh hưởng đến đồng nghiệp"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Đơn vị xảy ra vi phạm về ma túy. Qua xác minh, người đứng đầu đã không tổ chức phổ biến quy định, không kiểm tra và chậm báo cáo vụ việc. Nhận định nào đúng nhất?", "a": 3, "opts": ["Chỉ chịu trách nhiệm nếu trực tiếp biết và che giấu hành vi vi phạm", "Người đứng đầu không chịu trách nhiệm vì hành vi vi phạm do cá nhân thực hiện", "Chỉ Ban Kiểm soát chịu trách nhiệm vì có chức năng giám sát", "Người đứng đầu có thể chịu trách nhiệm liên đới do buông lỏng quản lý và chậm báo cáo"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Nhân viên kỹ thuật được bác sĩ kê thuốc hướng thần có thể ảnh hưởng đến khả năng phản xạ khi vận hành thiết bị. Nhân viên cần làm gì?", "a": 0, "opts": ["Khai báo với người quản lý trực tiếp về việc sử dụng thuốc có thể ảnh hưởng đến khả năng vận hành an toàn", "Vẫn làm việc bình thường vì thuốc được bác sĩ kê đơn", "Chỉ cần khai báo nếu xuất hiện tác dụng phụ", "Chỉ cần lưu lại đơn thuốc để xuất trình khi được yêu cầu"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Một CBNV chủ động khai báo đã sử dụng trái phép chất ma túy trước khi bị phát hiện hoặc kiểm tra và cam kết tham gia điều trị, cai nghiện. Cách xử lý nào phù hợp nhất?", "a": 0, "opts": ["Được xem xét là tình tiết giảm nhẹ; được hỗ trợ tiếp cận điều trị và không bố trí tại vị trí an toàn trọng yếu trong thời gian điều trị", "Chỉ cần cam kết không tái phạm, không cần điều trị", "Đương nhiên được miễn mọi hình thức kỷ luật", "Vẫn bố trí tại vị trí an toàn trọng yếu nếu chưa có sự cố"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Một nhân sự thuộc vị trí an toàn trọng yếu từ chối xét nghiệm ma túy theo kế hoạch đã được phê duyệt mà không có lý do chính đáng. Theo Thông báo, trường hợp này được xử lý thế nào?", "a": 3, "opts": ["Chỉ lập biên bản nhắc nhở lần đầu", "Cho phép tiếp tục làm việc nhưng bố trí xét nghiệm vào lần sau", "Chỉ xử lý nếu sau đó chứng minh được người này đã sử dụng ma túy", "Xử lý như trường hợp có kết quả xét nghiệm dương tính"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết Thực thi văn hóa Tập đoàn, chống tham nhũng và gian lận, phòng chống ma túy và bảo mật thông tin, Bản cam kết được CBNV ký lại vào thời điểm nào?", "a": 0, "opts": ["Tháng 01 hằng năm", "Tháng 6 hằng năm, gắn với Tháng hành động phòng chống ma túy", "Chỉ ký một lần khi ký HĐLĐ đầu tiên", "Định kỳ 02 năm một lần"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, nhân sự mới ký HĐLĐ mà đang hút thuốc lá cam kết bỏ thuốc lá trong vòng bao lâu?", "a": 1, "opts": ["03 tháng", "06 tháng", "12 tháng", "Ngay khi ký HĐLĐ"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, trường hợp nhận quà tặng u nước – Kỷ luật – Trách nhiệm", "Trung thành – Trung thực – Nhiệt tâm", "Khiêm nhường – Thực chất – Tự trọng", "Khỏe thể chất – Sáng tâm hồn – Giàu tri thức"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, trường hợp nào sau đây KHÔNG thuộc các trường hợp CBNV phải báo cáo Lãnh đạo cấp trên hoặc gửi thông tin tới hòm thư, số điện thoại tiếp nhận góp ý của Tập đoàn?", "a": 0, "opts": ["Khi có bất đồng ý kiến cá nhân với đồng nghiệp về cách thức triển khai công việc", "Khi nhận thấy rủi ro, sự việc có thể gây ảnh hưởng xấu tới lợi ích của Công ty", "Khi nhận thức có nguy cơ hoặc phát sinh xung đột lợi ích tại Công ty", "Khi nghi ngờ khách hàng, nhà thầu, đối tác có hành vi tham nhũng, gian lận"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, nghĩa vụ tuân thủ các quy định về an ninh bảo mật thông tin của CBNV được áp dụng trong khoảng thời gian nào?", "a": 1, "opts": ["Chỉ trong thời gian thử việc", "Trong suốt thời gian làm việc cũng như sau khi hợp đồng lao động kết thúc", "Trong suốt thời gian làm việc và 12 tháng sau khi nghỉ việc", "Chỉ trong thời gian làm việc tại Công ty"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, riêng đối với hành vi vi phạm về ma túy, người ký cam kết chấp nhận nội dung nào sau đây?", "a": 2, "opts": ["Chỉ bị xử lý kỷ luật nội bộ, không chuyển cơ quan chức năng", "Được tự khai báo nhiều lần để giảm nhẹ hình thức xử lý", "Công ty chuyển hồ sơ đến cơ quan chức năng để xử lý theo quy định", "Bị kéo dài thời hạn nâng lương không quá 06 tháng"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, {"q": "Theo Bản cam kết, CBNV chỉ được sử dụng thuốc gây nghiện, thuốc hướng thần trong trường hợp nào?", "a": 3, "opts": ["Khi được đồng nghiệp có chuyên môn y tế khuyên dùng", "Khi đã thông báo cho người quản lý trực tiếp", "Ngoài giờ làm việc và ngoài khuôn viên Công ty", "Theo đúng đơn của cơ sở y tế có thẩm quyền"], "group": "Cam kết văn hóa & Nghiêm cấm ma túy"}, function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const bank=shuffle(SOURCE.map((q,id)=>({...q,id,choices:shuffle(q.opts.map((text,i)=>({text,original:i})))})));
const selections=new Map();const $=id=>document.getElementById(id);
const groups=[...new Set(SOURCE.map(x=>x.group))];const sel=$('group');
for(const [value,label] of [['all',`Tất cả chủ đề (${SOURCE.length} câu)`],...groups.map(g=>[g,`${g} (${SOURCE.filter(x=>x.group===g).length} câu)`])]){let o=document.createElement('option');o.value=value;o.textContent=label;sel.append(o)}
function render(){const g=sel.value;const base=bank.filter(x=>g==='all'||x.group===g);const done=base.filter(x=>selections.has(x.id));const right=done.filter(x=>selections.get(x.id)===x.a).length;
$('total').textContent=base.length;$('done').textContent=`${done.length} / ${base.length}`;$('right').textContent=right;$('wrong').textContent=done.length-right;
const term=$('search').value.toLocaleLowerCase('vi').trim(),filter=$('filter').value;
const view=base.filter(x=>(!term||(x.q+' '+x.opts.join(' ')).toLocaleLowerCase('vi').includes(term))&&(filter==='all'||(filter==='todo'&&!selections.has(x.id))||(filter==='wrong'&&selections.has(x.id)&&selections.get(x.id)!==x.a)||(filter==='right'&&selections.get(x.id)===x.a)));
const root=$('questions');root.replaceChildren();if(!view.length){let p=document.createElement('div');p.className='empty';p.textContent='Không có câu hỏi phù hợp.';root.append(p);return}
view.forEach((q,i)=>{let card=document.createElement('article');card.className='question';let top=document.createElement('div');top.className='qtop';let number=document.createElement('span');number.textContent=`Câu ${i+1} / ${view.length}`;let tag=document.createElement('span');tag.textContent=q.group;top.append(number,tag);card.append(top);let h=document.createElement('h3');h.textContent=q.q;card.append(h);let answers=document.createElement('div');answers.className='answers';let chosen=selections.get(q.id);q.choices.forEach((c,k)=>{let b=document.createElement('button');b.className='answer';b.type='button';let l=document.createElement('span');l.className='letter';l.textContent='ABCD'[k]+'.';let t=document.createElement('span');t.textContent=c.text;b.append(l,t);if(chosen!==undefined){b.disabled=true;if(c.original===q.a)b.classList.add('correct');else if(c.original===chosen)b.classList.add('wrong')}else b.addEventListener('click',()=>{selections.set(q.id,c.original);render()});answers.append(b)});card.append(answers);if(chosen!==undefined){let f=document.createElement('div');f.className='feedback '+(chosen===q.a?'ok':'bad');let letter='ABCD'[q.choices.findIndex(c=>c.original===q.a)];f.textContent=(chosen===q.a?'✓ Chính xác!':'✗ Chưa đúng.')+' Đáp án đúng: '+letter+'. '+q.opts[q.a];card.append(f)}root.append(card)})}
sel.addEventListener('change',render);$('filter').addEventListener('change',render);$('search').addEventListener('input',render);$('reset').addEventListener('click',()=>{if(confirm('Làm lại từ đầu và đảo thứ tự câu hỏi, đáp án?'))location.reload()});render();
